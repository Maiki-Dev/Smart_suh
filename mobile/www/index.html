<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Smart СӨХ</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        text-align: center;
      }
      .card {
        max-width: 22rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        font-size: 0.875rem;
        line-height: 1.5;
        color: #94a3b8;
      }
      code {
        display: block;
        margin-top: 1rem;
        padding: 0.75rem;
        border-radius: 0.5rem;
        background: #1e293b;
        font-size: 0.75rem;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Smart СӨХ</h1>
      <p>
        Mobile app серверийн хаяг тохируулаагүй байна. Sync хийхээс өмнө
        <strong>CAPACITOR_SERVER_URL</strong> эсвэл
        <strong>NEXT_PUBLIC_APP_URL</strong> заана.
      </p>
      <code>CAPACITOR_SERVER_URL=https://your-app.vercel.app npm run mobile:sync</code>
    </div>
  </body>
</html>
